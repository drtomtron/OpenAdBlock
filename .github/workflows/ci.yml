name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and package (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The project has no dependencies on purpose, so there is nothing to install.
      - name: Confirm there are no dependencies to install
        run: |
          if [ -d node_modules ]; then
            echo "node_modules should not be committed" >&2
            exit 1
          fi
          node --version

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Package
        run: npm run build

      - name: Upload the built extension
        if: matrix.node == '22'
        uses: actions/upload-artifact@v4
        with:
          name: openadblock-extension
          path: dist/*.zip
          if-no-files-found: error

  addon-lint:
    name: Mozilla add-on linter
    runs-on: ubuntu-latest
    # Advisory: this is what addons.mozilla.org runs on upload. It needs the
    # network, so a failure here does not fail the build.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: web-ext lint
        run: npx --yes web-ext@8 lint --source-dir=src --warnings-as-errors=false
